name: user-management-api

services:
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-user_management}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-user-management-api}
      JWT_TTL: ${JWT_TTL:-1h}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    stop_grace_period: 20s

volumes:
  mongo-data:
