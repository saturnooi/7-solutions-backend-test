# Live reload for local development. Start it with `make dev`.
# All options: https://github.com/air-verse/air
root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  entrypoint = ["./tmp/api"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", ".git"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  # Stop the running binary when a build fails, so a stale version never keeps serving.
  stop_on_error = true
  # Send SIGINT first so the server can shut down gracefully, and force-kill after kill_delay.
  send_interrupt = true
  kill_delay = "5s"

[misc]
  clean_on_exit = true
