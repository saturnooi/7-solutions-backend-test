template: matryer
dir: '{{.InterfaceDir}}'
filename: mocks_test.go
pkgname: '{{.SrcPackageName}}'
structname: '{{.InterfaceName}}Mock'
formatter: goimports
formatter-options:
  goimports:
    local-prefix: user-management-api
force-file-write: true
packages:
  user-management-api/internal/application/userservice:
    interfaces:
      UserRepository: {}
      PasswordHasher: {}
      TokenIssuer: {}
      TokenVerifier: {}
      UserChecker: {}
  user-management-api/internal/adapters/http:
    interfaces:
      UserService: {}
      Authenticator: {}
      HealthChecker: {}
  user-management-api/internal/adapters/grpc:
    interfaces:
      UserService: {}
      Authenticator: {}
  user-management-api/internal/adapters/worker:
    interfaces:
      UserCounter: {}
