version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - unconvert
  settings:
    # Architecture rules: dependencies must point inward, towards domain.
    depguard:
      rules:
        domain:
          files:
            - "**/internal/domain/**"
          allow:
            - $gostd
          deny:
            - pkg: net/http
              desc: domain must not depend on a delivery protocol
            - pkg: database/sql
              desc: domain must not depend on persistence
        application:
          files:
            - "**/internal/application/**"
          allow:
            - $gostd
            - user-management-api/internal/domain
          deny:
            - pkg: net/http
              desc: use cases must not depend on a delivery protocol
            - pkg: database/sql
              desc: use cases must reach storage through a port
        delivery:
          files:
            - "**/internal/adapters/http/**"
            - "**/internal/adapters/grpc/**"
            - "**/internal/adapters/worker/**"
          deny:
            - pkg: go.mongodb.org/mongo-driver
              desc: delivery adapters must call use cases, not the database
            - pkg: user-management-api/internal/adapters/repository
              desc: delivery adapters must call use cases, not repositories
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # Tests use fixed secrets and passwords on purpose.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - user-management-api

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
